<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroTech - Înregistrare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --accent: #0071e3;
            --red: #e53935;
            --bg: #000000;
            --card: #1a1a1a;
            --input-bg: #111111;
            --white: #f5f5f7;
            --text: #f5f5f7;
            --text-secondary: #86868b;
            --border: #2d2d2d;
            --success: #34c759;
            --danger: #ff3b30;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .register-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 36px;
            width: 400px;
            max-width: 90vw;
        }

        .register-card h2 {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .register-subtitle {
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }

        .form-group input::placeholder {
            color: #555;
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: var(--red);
            color: white;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .submit-btn:hover {
            background: #c62828;
        }

        .msg {
            text-align: center;
            margin-top: 14px;
            font-size: 13px;
            font-weight: 500;
        }

        .bottom-links {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .bottom-links a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .bottom-links a:hover {
            text-decoration: underline;
        }

        .logo-link {
            font-size: 22px;
            font-weight: 700;
            color: var(--white);
            text-decoration: none;
            letter-spacing: -0.5px;
            margin-bottom: 32px;
        }

        .logo-link span {
            color: var(--red);
        }
    </style>
</head>

<body>

<a href="index.html" class="logo-link">Electro<span>Tech</span></a>

<div class="register-card">
    <h2>Creează Cont</h2>
    <p class="register-subtitle">Înregistrează-te pentru a cumpăra de pe ElectroTech</p>

    <div class="form-row">
        <div class="form-group">
            <label>Prenume</label>
            <input type="text" id="firstName" placeholder="Prenume">
        </div>
        <div class="form-group">
            <label>Nume</label>
            <input type="text" id="lastName" placeholder="Nume">
        </div>
    </div>
    <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="exemplu@email.com">
    </div>
    <div class="form-group">
        <label>Parolă</label>
        <input type="password" id="password" placeholder="Minim 6 caractere">
    </div>

    <button class="submit-btn" onclick="register()">Înregistrare</button>
    <div id="message" class="msg"></div>

    <div class="bottom-links">
        Ai deja cont? <a href="login.html">Autentifică-te</a>
        <br><a href="index.html" style="color: var(--text-secondary); margin-top: 8px; display: inline-block;">←
        Înapoi la magazin</a>
    </div>
</div>

<script>
    function logAccess(actionName) {
        const userData = localStorage.getItem('loggedUser');
        const email = userData ? JSON.parse(userData).email : "Vizitator Anonim";
        fetch('http://localhost:8080/api/logs/track', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userEmail: email, action: actionName, pageUrl: window.location.href })
        }).catch(() => {});
    }

    async function register() {
        const data = {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };

        try {
            const response = await fetch('http://localhost:8080/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                document.getElementById('message').innerText = "Cont creat cu succes!";
                document.getElementById('message').style.color = "#34c759";
            } else {
                document.getElementById('message').innerText = "Eroare la înregistrare.";
                document.getElementById('message').style.color = "#ff3b30";
            }
        } catch (err) {
            console.error(err);
        }
    }

    logAccess("Vizualizare Pagina Înregistrare");
</script>
</body>

</html>
