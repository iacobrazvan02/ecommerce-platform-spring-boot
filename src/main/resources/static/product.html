<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElectroTech - Produs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --accent: #0071e3;
      --accent-hover: #005bb5;
      --red: #e53935;
      --red-hover: #c62828;
      --bg: #000000;
      --bg-secondary: #111111;
      --card: #1a1a1a;
      --white: #f5f5f7;
      --text: #f5f5f7;
      --text-secondary: #86868b;
      --border: #2d2d2d;
      --success: #34c759;
      --danger: #ff3b30;
      --radius: 12px;
      --nav-height: 64px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .header {
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 40px;
      height: var(--nav-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -0.5px;
    }

    .logo span {
      color: var(--red);
    }

    .user-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .user-actions a,
    .user-actions span {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: color 0.2s;
    }

    .user-actions a:hover,
    .user-actions span:hover {
      color: var(--accent);
    }

    .btn-register {
      background: var(--red);
      color: var(--white) !important;
      padding: 8px 18px;
      border-radius: 20px;
    }

    .logout-btn {
      color: var(--danger) !important;
    }

    .breadcrumb {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px 40px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .breadcrumb a {
      color: var(--accent);
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    .product-page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 40px 60px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: start;
    }

    .product-image-section {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      position: sticky;
      top: 100px;
    }

    .product-image-section img {
      width: 100%;
      height: 500px;
      object-fit: contain;
      backgroud: #fff;
      padding: 20px;
      display: block;
    }

    .product-info {
      padding: 8px 0;
    }

    .product-category-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--red);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .product-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.25;
      margin-bottom: 16px;
    }

    .product-stock {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 24px;
    }

    .product-stock.in-stock {
      background: rgba(52, 199, 89, 0.15);
      color: var(--success);
    }

    .product-stock.out-of-stock {
      background: rgba(255, 59, 48, 0.15);
      color: var(--danger);
    }

    .price-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
    }

    .product-price {
      font-size: 32px;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 4px;
    }

    .product-price .currency {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .price-note {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .buy-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: var(--white);
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }

    .buy-btn:hover {
      background: var(--accent-hover);
    }

    .buy-btn.disabled {
      background: var(--border);
      color: var(--text-secondary);
      cursor: not-allowed;
    }

    .wishlist-product-btn {
      width: 100%;
      padding: 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .wishlist-product-btn:hover {
      border-color: var(--red);
      color: var(--red);
      background: rgba(229, 57, 53, 0.08);
    }

    .wishlist-product-btn.active {
      border-color: var(--red);
      background: rgba(229, 57, 53, 0.12);
      color: var(--red);
    }

    @keyframes heartPop {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }

      100% {
        transform: scale(1);
      }
    }

    .wishlist-product-btn.pop {
      animation: heartPop 0.35s ease;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      z-index: 2000;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast.success {
      border-color: var(--success);
    }

    .toast.error {
      border-color: var(--danger);
    }

    .specs-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .specs-title {
      font-size: 16px;
      font-weight: 600;
      padding: 20px 24px 12px;
      border-bottom: 1px solid var(--border);
    }

    .specs-list {
      list-style: none;
    }

    .specs-list li {
      display: flex;
      justify-content: space-between;
      padding: 12px 24px;
      font-size: 14px;
      border-bottom: 1px solid var(--bg-secondary);
    }

    .specs-list li:last-child {
      border-bottom: none;
    }

    .specs-list .spec-label {
      color: var(--text-secondary);
      flex-shrink: 0;
      margin-right: 16px;
    }

    .specs-list .spec-value {
      font-weight: 500;
      text-align: right;
    }

    .gallery-thumbs {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .gallery-thumb {
      width: 64px;
      height: 48px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid var(--border);
      cursor: pointer;
      transition: border-color 0.2s;
      opacity: 0.6;
    }

    .gallery-thumb:hover,
    .gallery-thumb.active {
      border-color: var(--accent);
      opacity: 1;
    }

    .reviews-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 40px 60px;
    }

    .reviews-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 20px;
    }

    .review-form {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
    }

    .review-form h3 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .stars-input {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
    }

    .stars-input .star {
      font-size: 26px;
      cursor: pointer;
      color: var(--border);
      transition: color 0.15s;
    }

    .stars-input .star.active {
      color: #f5a623;
    }

    .review-textarea {
      width: 100%;
      min-height: 80px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-secondary);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      outline: none;
      margin-bottom: 12px;
    }

    .review-textarea:focus {
      border-color: var(--accent);
    }

    .review-submit-btn {
      padding: 10px 24px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }

    .review-submit-btn:hover {
      background: var(--accent-hover);
    }

    .review-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 12px;
    }

    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .review-author {
      font-weight: 600;
      font-size: 14px;
    }

    .review-stars {
      color: #f5a623;
      font-size: 14px;
      letter-spacing: 2px;
    }

    .review-date {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .review-comment {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-top: 8px;
    }

    .review-delete {
      background: none;
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .review-delete:hover {
      background: var(--danger);
      color: white;
    }

    .no-reviews {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .footer {
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 30px 40px;
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .loading {
      text-align: center;
      padding: 120px 20px;
      font-size: 16px;
      color: var(--text-secondary);
      grid-column: 1 / -1;
    }

    @media (max-width: 768px) {
      .product-page {
        grid-template-columns: 1fr;
        gap: 24px;
        padding: 0 20px 40px;
      }

      .product-image-section {
        position: static;
      }

      .product-image-section img {
        height: 280px;
      }

      .breadcrumb {
        padding: 12px 20px;
      }

      .header-inner {
        padding: 0 20px;
      }

      .product-title {
        font-size: 22px;
      }
    }

    .recommendations-section {
      max-width: 1280px;
      margin: 0 auto;
      padding: 40px 40px 20px;
    }

    .recommendations-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 20px;
      color: var(--text);
    }

    .recommendations-wrapper {
      position: relative;
    }

    .recommendations-track {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 12px;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .recommendations-track::-webkit-scrollbar {
      display: none;
    }

    .rec-card {
      flex: 0 0 220px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .rec-card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .rec-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: var(--bg-secondary);
      display: block;
    }

    .rec-card-body {
      padding: 14px 16px;
    }

    .rec-card-category {
      font-size: 10px;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .rec-card-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .rec-card-price {
      font-size: 16px;
      font-weight: 700;
      color: var(--white);
    }

    .rec-card-price .currency {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .rec-scroll-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      transition: all 0.2s;
      opacity: 0.8;
    }

    .rec-scroll-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      opacity: 1;
    }

    .rec-scroll-btn.left {
      left: -12px;
    }

    .rec-scroll-btn.right {
      right: -12px;
    }

    .rec-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 14px;
    }

    .rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.2s;
    }

    .rec-dot.active {
      background: var(--accent);
    }

    @media (max-width: 768px) {
      .recommendations-section {
        padding: 24px 20px 16px;
      }

      .rec-card {
        flex: 0 0 180px;
      }

      .rec-scroll-btn {
        display: none;
      }
    }
  </style>
</head>

    <div id="reviewsList"></div>
  </div>

    © 2026 ElectroTech Store. Toate drepturile rezervate.

        { label: 'Rezoluție', value: '4K UHD (3840x2160)' },
        { label: 'Panou', value: 'LED' },
        { label: 'Smart TV', value: 'Da — Tizen' },
        { label: 'HDR', value: 'HDR10+' },
        { label: 'Refresh', value: '60Hz' }
      ],
      'Gaming': [
        { label: 'Tip', value: 'Periferice Gaming' },
        { label: 'Senzor', value: 'Optic 16000 DPI' },
        { label: 'Iluminare', value: 'RGB' },
        { label: 'Conectivitate', value: 'USB / Wireless' },
        { label: 'Compatibilitate', value: 'PC, PS5, Xbox' },
        { label: 'Garanție', value: '24 luni' }
      ],
      'Accesorii': [
        { label: 'Tip', value: 'Accesoriu universal' },
        { label: 'Conectivitate', value: 'Bluetooth 5.3' },
        { label: 'Compatibilitate', value: 'iOS / Android' },
        { label: 'Material', value: 'Premium' },
        { label: 'Culoare', value: 'Negru' },
        { label: 'Garanție', value: '12 luni' }
      ]
    };

    function getProductSpecs(productId, categoryName) {
      if (productSpecs[productId]) return productSpecs[productId];
      return categorySpecs[categoryName] || categorySpecs['Accesorii'];
    }

    function enrichProduct(product, index) {
      const cat = product.category || categories[index % categories.length];
      const inStock = product.stockQuantity !== undefined ? product.stockQuantity > 0 : (product.stock !== undefined ? product.stock > 0 : (index % 5 !== 0));
      return { ...product, category: cat, inStock, specsDetail: getProductSpecs(product.id, cat) };
    }

    function initAuth() {
      const nav = document.getElementById('userNav');
      const userData = localStorage.getItem('loggedUser');
      if (userData) {
        const user = JSON.parse(userData);
        nav.innerHTML = `
                    <span style="font-size:13px">Salut, <strong>${user.email}</strong></span>
                    <a href="profil.html" style="color: var(--accent); font-weight: 600;">👤 Profil</a>
                    <a href="wishlist.html" style="color: #e53935; font-weight: 600;">Favorite</a>
                    <a href="cart.html">🛒 Coș</a>
                    <span class="logout-btn" onclick="logout()">Logout</span>
                `;
      } else {
        nav.innerHTML = `
                    <a href="login.html">Autentificare</a>
                    <a href="register.html" class="btn-register">Cont Nou</a>
                `;
      }
    }
    function logout() { localStorage.removeItem('loggedUser'); window.location.reload(); }

    async function loadProduct() {
      const params = new URLSearchParams(window.location.search);
      const productId = params.get('id');
      if (!productId) {
        document.getElementById('productPage').innerHTML = '<div class="loading">Produs negăsit. <a href="index.html" style="color:var(--accent)">Înapoi</a></div>';
        return;
      }
      try {
        const response = await fetch('http://localhost:8080/api/products');
        const products = await response.json();

        const rawProduct = products.find(p => p.id == productId);

        if (!rawProduct) {
          document.getElementById('productPage').innerHTML = '<div class="loading">Produs negăsit. <a href="index.html" style="color:var(--accent)">Înapoi</a></div>';
          return;
        }

        const categoryName = rawProduct.category && typeof rawProduct.category === 'object'
          ? rawProduct.category.name
          : (rawProduct.category || 'Accesorii');

        const product = {
          ...rawProduct,
          displayCategory: categoryName,
          inStock: (rawProduct.stockQuantity !== undefined ? rawProduct.stockQuantity : rawProduct.stock) > 0,
          specsDetail: getProductSpecs(rawProduct.id, categoryName)
        };

        document.getElementById('breadcrumb').innerHTML = `<a href="index.html">Acasă</a> / <a href="index.html">${product.displayCategory}</a> / <span>${product.name}</span>`;
        document.title = `${product.name} — ElectroTech`;

        let productImages = [];
        try {
          const imgRes = await fetch(`http://localhost:8080/api/product-images/product/${product.id}`);
          productImages = await imgRes.json();
        } catch (e) { productImages = []; }

        const mainImg = productImages.length > 0
          ? productImages[0].imageUrl
          : 'https://placehold.co/800x600/1a1a1a/666?text=Fara+imagine';

        const galleryHtml = productImages.length > 1
          ? `<div class="gallery-thumbs">${productImages.map((img, i) =>
            `<img class="gallery-thumb ${i === 0 ? 'active' : ''}" src="${img.imageUrl}" onclick="switchImage(this, '${img.imageUrl}')" />`
          ).join('')}</div>`
          : '';

        document.getElementById('productPage').innerHTML = `
                    <div class="product-image-section">
                        <img id="mainProductImg" src="${mainImg}" alt="${product.name}">
                        ${galleryHtml}
                    </div>
                    <div class="product-info">
                        <div class="product-category-label">${product.displayCategory}</div>
                        <h1 class="product-title">${product.name}</h1>
                        <span class="product-stock ${product.inStock ? 'in-stock' : 'out-of-stock'}">
                            ${product.inStock ? '● În stoc' : '● Stoc epuizat'}
                        </span>
                        <div class="price-section">
                            <div class="product-price">${product.price} <span class="currency">lei</span></div>
                            <div class="price-note">Preț cu TVA inclus</div>
                            <button class="buy-btn ${!product.inStock ? 'disabled' : ''}"
                                    onclick="${product.inStock ? `addToCart(${product.id})` : ''}">
                                ${product.inStock ? 'Adaugă în coș' : 'Produs indisponibil'}
                            </button>
                            <button class="wishlist-product-btn" id="wishProductBtn"
                                    onclick="toggleWishlist(${product.id})">
                                Adaugă la favorite
                            </button>
                        </div>
                        <div class="specs-section">
                            <div class="specs-title">Specificații</div>
                            <ul class="specs-list">
                                ${product.specsDetail.map(s => `
                                    <li>
                                        <span class="spec-label">${s.label}</span>
                                        <span class="spec-value">${s.value}</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    </div>
                `;

        fetch(`http://localhost:8080/api/analytics/track/${product.id}`, { method: 'POST' }).catch(() => { });

        checkWishlistStatus(product.id);

        loadReviews(product.id);

        loadRecommendations(product.id, product.displayCategory);

      } catch (err) {
        console.error(err);
        document.getElementById('productPage').innerHTML = '<div class="loading">Serverul nu răspunde. <a href="index.html" style="color:var(--accent)">Înapoi</a></div>';
      }
    }

    async function loadRecommendations(currentProductId, currentCategory) {
      try {
        const [productsRes, imagesData] = await Promise.all([
          fetch('http://localhost:8080/api/products').then(r => r.json()),
          Promise.resolve(null)
        ]);

        let candidates = productsRes.filter(p => {
          const cat = p.category && typeof p.category === 'object' ? p.category.name : (p.category || '');
          return p.id !== currentProductId && cat.toLowerCase() !== currentCategory.toLowerCase();
        });

        candidates.sort(() => Math.random() - 0.5);
        const recommended = candidates.slice(0, 6);

        if (recommended.length === 0) return;

        const imgPromises = recommended.map(p =>
          fetch(`http://localhost:8080/api/product-images/product/${p.id}`)
            .then(r => r.json()).catch(() => [])
        );
        const allImgs = await Promise.all(imgPromises);

        const track = document.getElementById('recTrack');
        track.innerHTML = recommended.map((p, idx) => {
          const cat = p.category && typeof p.category === 'object' ? p.category.name : (p.category || 'Accesorii');
          const imgUrl = allImgs[idx] && allImgs[idx].length > 0
            ? allImgs[idx][0].imageUrl
            : 'https://placehold.co/400x300/1a1a1a/666?text=Fara+imagine';
          return `
            <div class="rec-card" onclick="window.location.href='product.html?id=${p.id}'">
              <img src="${imgUrl}" alt="${p.name}" loading="lazy" onerror="this.src='https://placehold.co/400x300/1a1a1a/666?text=Fara+imagine'">
              <div class="rec-card-body">
                <div class="rec-card-category">${cat}</div>
                <div class="rec-card-name">${p.name}</div>
                <div class="rec-card-price">${p.price} <span class="currency">lei</span></div>
              </div>
            </div>
          `;
        }).join('');

        const dotsContainer = document.getElementById('recDots');
        const totalDots = Math.ceil(recommended.length / 3);
        dotsContainer.innerHTML = Array.from({ length: totalDots }, (_, i) =>
          `<div class="rec-dot ${i === 0 ? 'active' : ''}" onclick="scrollRecTo(${i})"></div>`
        ).join('');

        track.addEventListener('scroll', () => {
          const maxScroll = track.scrollWidth - track.clientWidth;
          if (maxScroll <= 0) return;
          const scrollRatio = track.scrollLeft / maxScroll;
          const activeIdx = Math.round(scrollRatio * (totalDots - 1));
          document.querySelectorAll('.rec-dot').forEach((dot, i) => {
            dot.classList.toggle('active', i === activeIdx);
          });
        });

        document.getElementById('recommendationsSection').style.display = 'block';
      } catch (e) {
        console.error('Eroare recomandări:', e);
      }
    }

    function scrollRec(direction) {
      const track = document.getElementById('recTrack');
      track.scrollBy({ left: direction * 720, behavior: 'smooth' });
    }

    function scrollRecTo(index) {
      const track = document.getElementById('recTrack');
      track.scrollTo({ left: index * 720, behavior: 'smooth' });
    }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      setTimeout(() => { toast.classList.remove('show'); }, 2500);
    }

    async function checkWishlistStatus(productId) {
      const userData = localStorage.getItem('loggedUser');
      if (!userData) return;
      const user = JSON.parse(userData);
      try {
        const res = await fetch(`http://localhost:8080/api/wishlist/${user.id}`);
        const items = await res.json();
        const inWishlist = items.some(i => i.product.id === productId);
        const btn = document.getElementById('wishProductBtn');
        if (btn && inWishlist) {
          btn.classList.add('active');
          btn.innerHTML = 'În lista de dorințe';
        }
      } catch (e) { console.error(e); }
    }

    async function toggleWishlist(productId) {
      const userData = localStorage.getItem('loggedUser');
      if (!userData) {
        alert('Loghează-te pentru a adăuga la favorite!');
        window.location.href = 'login.html';
        return;
      }
      const user = JSON.parse(userData);
      const btn = document.getElementById('wishProductBtn');

      if (btn && btn.classList.contains('active')) {
        try {
          const res = await fetch(`http://localhost:8080/api/wishlist/${user.id}`);
          const items = await res.json();
          const item = items.find(i => i.product.id === productId);
          if (item) {
            await fetch(`http://localhost:8080/api/wishlist/${item.id}?userId=${user.id}`, { method: 'DELETE' });
            btn.classList.remove('active');
            btn.innerHTML = 'Adaugă la favorite';
            btn.classList.add('pop');
            setTimeout(() => btn.classList.remove('pop'), 350);
            showToast('Eliminat din favorite');
          }
        } catch (e) { console.error(e); showToast('Eroare!', 'error'); }
      } else {
        try {
          const res = await fetch('http://localhost:8080/api/wishlist/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: user.id, productId })
          });
          if (res.ok) {
            if (btn) {
              btn.classList.add('active');
              btn.innerHTML = 'În lista de dorințe';
              btn.classList.add('pop');
              setTimeout(() => btn.classList.remove('pop'), 350);
            }
            showToast('Adăugat la favorite');
          } else {
            const err = await res.json();
            showToast(err.error || 'Eroare!', 'error');
          }
        } catch (e) { console.error(e); showToast('Eroare de conexiune!', 'error'); }
      }
    }

    async function addToCart(productId) {
      const userData = localStorage.getItem('loggedUser');
      if (!userData) { alert('Loghează-te pentru a cumpăra!'); window.location.href = 'login.html'; return; }
      const user = JSON.parse(userData);
      try {
        const res = await fetch('http://localhost:8080/api/orders/add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: user.id, productId, quantity: 1 })
        });
        if (res.ok) alert('Produs adăugat în coș!');
        else alert('Eroare la adăugare!');
      } catch (err) { console.error(err); }
    }

    let selectedRating = 0;
    let currentProductId = null;

    function setRating(val) {
      selectedRating = val;
      document.querySelectorAll('#starsInput .star').forEach(s => {
        s.classList.toggle('active', parseInt(s.dataset.val) <= val);
      });
    }

    async function loadReviews(productId) {
      currentProductId = productId;
      const container = document.getElementById('reviewsContainer');
      container.style.display = 'block';

      const userData = localStorage.getItem('loggedUser');
      if (userData) {
        document.getElementById('reviewForm').style.display = 'block';
      }

      try {
        const res = await fetch(`http://localhost:8080/api/reviews/product/${productId}`);
        const reviews = await res.json();
        const list = document.getElementById('reviewsList');

        if (!reviews || reviews.length === 0) {
          list.innerHTML = '<div class="no-reviews">Nu exist\u0103 recenzii pentru acest produs. Fii primul care las\u0103 o p\u0103rere!</div>';
          return;
        }

        const loggedUser = userData ? JSON.parse(userData) : null;

        list.innerHTML = reviews.map(r => {
          const stars = '\u2605'.repeat(r.rating) + '\u2606'.repeat(5 - r.rating);
          const authorEmail = r.user ? r.user.email : 'Anonim';
          const authorName = authorEmail.includes('@') ? authorEmail.split('@')[0] : authorEmail;
          const date = Array.isArray(r.createdAt)
            ? new Date(r.createdAt[0], r.createdAt[1] - 1, r.createdAt[2], r.createdAt[3] || 0, r.createdAt[4] || 0).toLocaleDateString('ro-RO')
            : new Date(r.createdAt).toLocaleDateString('ro-RO');
          const canDelete = loggedUser && ((r.user && r.user.id === loggedUser.id) || loggedUser.role === 'ADMIN');

          return `
            <div class="review-card">
              <div class="review-header">
                <div>
                  <span class="review-author">${authorName}</span>
                  <span class="review-date" style="margin-left:10px;">${date}</span>
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                  <span class="review-stars">${stars}</span>
                  ${canDelete ? `<button class="review-delete" onclick="deleteReview(${r.id})">\u0218terge</button>` : ''}
                </div>
              </div>
              ${r.comment ? `<div class="review-comment">${r.comment}</div>` : ''}
            </div>
          `;
        }).join('');
      } catch (e) {
        console.error('Eroare recenzii:', e);
      }
    }

    async function submitReview() {
      if (selectedRating === 0) { showToast('Selecteaz\u0103 un rating!', 'error'); return; }
      const userData = localStorage.getItem('loggedUser');
      if (!userData) { showToast('Logheaz\u0103-te pentru a l\u0103sa o recenzie!', 'error'); return; }
      const user = JSON.parse(userData);
      const comment = document.getElementById('reviewComment').value;

      try {
        const res = await fetch('http://localhost:8080/api/reviews', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: user.id, productId: currentProductId, rating: selectedRating, comment })
        });
        if (res.ok) {
          showToast('Recenzie ad\u0103ugat\u0103!');
          document.getElementById('reviewComment').value = '';
          selectedRating = 0;
          document.querySelectorAll('#starsInput .star').forEach(s => s.classList.remove('active'));
          loadReviews(currentProductId);
        } else {
          const err = await res.json();
          showToast(err.error || 'Eroare!', 'error');
        }
      } catch (e) { showToast('Eroare de conexiune!', 'error'); }
    }

    function switchImage(thumb, url) {
      document.getElementById('mainProductImg').src = url;
      document.querySelectorAll('.gallery-thumb').forEach(t => t.classList.remove('active'));
      thumb.classList.add('active');
    }

    async function deleteReview(reviewId) {
      if (!confirm('\u0218tergi aceast\u0103 recenzie?')) return;
      try {
        const res = await fetch(`http://localhost:8080/api/reviews/${reviewId}`, { method: 'DELETE' });
        if (res.ok) {
          showToast('Recenzie \u0219tears\u0103!');
          loadReviews(currentProductId);
        }
      } catch (e) { showToast('Eroare!', 'error'); }
    }

    function logAccess(actionName) {
      const userData = localStorage.getItem('loggedUser');
      const email = userData ? JSON.parse(userData).email : "Vizitator Anonim";
      fetch('http://localhost:8080/api/logs/track', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userEmail: email, action: actionName, pageUrl: window.location.href })
      }).catch(() => { });
    }

    initAuth();
    loadProduct();
    logAccess("Vizualizare Pagina Produs");
  </script>
